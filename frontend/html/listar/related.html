<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Listagem de Familiares</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="../../public/css/bootstrap.min.css" />
    <!-- Cache Control -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="../../public/css/navbar.css" />
    <link rel="stylesheet" href="../../public/css/style.css" />

    <!-- DataTables CSS e Buttons -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.19/css/jquery.dataTables.min.css" />
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/1.6.5/css/buttons.dataTables.min.css"/>
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  </head>

  <body>
    <div class="wrapper">
      <!-- Sidebar  -->
      <nav id="sidebar">
        <div id="nav-placeholder"></div>
      </nav>
      
      <!-- Conteúdo da Página  -->
      <div id="content">
        <div class="card col-12">
          <h3 class="mt-4 text-center">Lista de Familiares</h3>
          <div class="card-body">
            <div class="container">
              <hr size="4" />
              <div class="row">
                <div class="col-12">
                  <h6>Nome do(a) Atendido</h6>
                  <div id="searchbar-assisted" name="assistedId"></div>
                </div>
                <div class="table-responsive">
                  <table id="relatedTable" class="table table-striped table-bordered display">
                    <thead>
                      <tr>
                        <th>Registro</th>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Telefone</th>
                        <th>Opções</th>
                      </tr>
                    </thead>
                    <tbody>
                      <!-- Exemplo de linha com dados e botões de ações -->
                      <tr>
                        <td>001</td>
                        <td>João da Silva</td>
                        <td>123.456.789-00</td>
                        <td>(11) 98765-4321</td>
                        <td>
                          <button type="button" class="btn btn-success btn-sm" title="Editar">
                            <i class="bi bi-pencil-square"></i>
                          </button>
                          <button type="button" class="btn btn-danger btn-sm delete-btn" title="Excluir">
                            <i class="bi bi-trash"></i>
                          </button>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
              <hr size="4" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="../../public/js/dist/jquery-3.6.0.min.js"></script>
    <script src="../../public/js/dist/jquery.mask.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- DataTables Buttons e jsPDF -->
    <script src="https://cdn.datatables.net/buttons/1.6.5/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.3/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/1.6.5/js/buttons.html5.min.js"></script>
    <script src="../../public/js/script.js"></script>
    <script type="module" src="../../public/js/fns/erroHandler.js"></script>

    <!-- Inicialização do DataTable com Exportação para PDF -->
    <script type="module">
      import { loadInfoDataTable } from '../../public/js/related.js';

      $(document).ready(function () {
        $('#relatedTable').DataTable({
          paging: true,
          searching: true,
          ordering: true,
          info: true,
          language: {
            url: "//cdn.datatables.net/plug-ins/1.10.19/i18n/Portuguese-Brasil.json"
          },
          dom: 'Bfrtip', // Inclui os botões
          buttons: [
            {
              extend: 'pdfHtml5',
              text: 'Baixar PDF',
              title: 'Lista de Familiares',
              className: 'btn btn-primary' // Estiliza o botão
            }
          ]
        });

        loadInfoDataTable();

        $('.delete-btn').on('click', function () {
          Swal.fire({
            title: 'Tem certeza?',
            text: "Essa ação não poderá ser desfeita!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#3085d6',
            cancelButtonColor: '#d33',
            confirmButtonText: 'Sim, excluir'
          }).then((result) => {
            if (result.isConfirmed) {
              Swal.fire(
                'Excluído!',
                'O registro foi excluído.',
                'success'
              );
            }
          });
        });
      });
    </script>
  </body>
</html>
