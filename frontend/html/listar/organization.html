<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Projeto Raios de Esperança - Organizações</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/public/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/public/css/navbar.css" />
    <link rel="stylesheet" href="/public/css/style.css" />

    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
  </head>
  
  <body>
    <div class="wrapper">
      <!-- Sidebar  -->
      <nav id="sidebar">
        <div id="nav-placeholder"></div>
      </nav>

      <!-- Conteúdo da Página -->
      <div id="content">
        <div class="card col-10 mx-auto mt-4">
          <h3 class="mt-4 text-center">Listagem de Organizações</h3>
          <hr>

          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-striped">
                <thead>
                  <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Nome da Organização</th>
                    <th scope="col">Descrição</th>
                    <th scope="col">Domínio</th>
                    <th scope="col">Ações</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Exemplo de dados para uma linha; cada linha representa uma organização -->
                  <tr>
                    <td>1</td>
                    <td>Organização ABC</td>
                    <td>Descrição da organização ABC</td>
                    <td>abc.org</td>
                    <td>
                      <button type="button" class="btn btn-success btn-sm" title="Editar">
                        <i class="bi bi-pencil-square"></i>
                      </button>
                      <button type="button" class="btn btn-danger btn-sm" title="Excluir">
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                  <!-- Outras linhas de exemplo podem ser adicionadas aqui -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JS -->
    <script src="/public/js/jquery-3.6.0.min.js"></script>
    <script src="/public/js/script.js"></script>
  </body>
</html>
