<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Atendimento Profissional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="../../public/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../public/css/navbar.css" />
  <link rel="stylesheet" href="../../public/css/style.css" />

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.10.19/css/jquery.dataTables.min.css" />
  <!-- Ícones do Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body>
  <div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div id="nav-placeholder"></div>
    </nav>

    <!-- Conteúdo da Página -->
    <div id="content">
      <div class="card col-12">
        <h3 class="mt-4 text-center">Atendimento Profissional</h3>
        <div class="card-body">
          <div class="container">
            <hr size="4" />
            <div class="table-responsive">
              <table id="specialityTable" class="table table-striped table-bordered display">
                <thead>
                  <tr>
                    <th>Registro</th>
                    <th>Atendido</th>
                    <th>Data do Atendimento</th>
                    <th>Nº Atendimentos</th>
                    <th>Resultado(s)</th>
                    <th>Opções</th>
                  </tr>
                </thead>
                <tbody>
                  <!-- Exemplo de linha com dados e botões de ações -->
                  <tr>
                    <td>001</td>
                    <td>Maria Silva</td>
                    <td>01/11/2024</td>
                    <td>5</td>
                    <td>Positivo</td>
                    <td>
                      <button type="button" class="btn btn-success btn-sm" title="Editar">
                        <i class="bi bi-pencil-square"></i>
                      </button>
                      <button type="button" class="btn btn-danger btn-sm" title="Excluir">
                        <i class="bi bi-trash"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <hr size="4" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="../../public/js/dist/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.min.js"></script>
  <script src="../../public/js/script.js"></script>
  <script type="module" src="../../public/js/fns/erroHandler.js"></script>

  <!-- Inicialização do DataTable -->
  <script type="module">
    import { loadInfoDataTable } from '../../public/js/professionalAttendance.js';

    $(document).ready(function () {
      $('#specialityTable').DataTable(); // Inicializa o DataTable
      loadInfoDataTable(); // Carrega os dados na tabela
    });
  </script>
</body>
</html>
