<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>Listagem de Especialidades</title>
  <meta name="description" content="" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="../../public/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../public/css/navbar.css" />

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.10.19/css/jquery.dataTables.min.css" />
</head>

<body>
  <div class="wrapper">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div id="nav-placeholder"></div>
    </nav>
    <!-- Conteúdo da Página -->
    <div id="content">
      <div class="card col-12">
        <h3 class="mt-4 ml-2" style="text-align: center">
          Lista de Especialidades
        </h3>
        <div class="card-body">
          <div class="container">
            <hr size="4" />
            <div class="row row-cols-12">
              <table id="specialityTable" class="display">
                <thead class="col-12">
                  <tr>
                    <th class="col-1">Registro</th>
                    <th class="col-7">Especialidade</th>
                    <th class="col-4">Opções</th>
                  </tr>

              </table>
            </div>
            <hr size="4" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery, DataTables e Scripts adicionais -->
  <script src="../../public/js/dist/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.min.js"></script>

  <!-- Script principal e de funções -->
  <script src="../../public/js/script.js"></script>
  <script type="module" src="../../public/js/fns/erroHandler.js"></script>

  <script type="module">
    // Importando função do arquivo correto (specialities.js)

    $(document).ready(function () {

    });
